name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n spark
      - name: Python syntax
        run: python -m compileall -q lab.py history.py settings.py manage.py benchmark_batches.py
      - name: Compose configuration
        run: docker compose config --quiet
